# Manual check: what would the publication list look like if it were refreshed now?
#
# The real refresh happens inside the deploy workflow, which fetches from OpenAlex on
# every build. This one writes nothing and commits nothing — it just prints the counts,
# so you can sanity-check a change to data/members.json or data/publications.config.json
# without deploying, and see whether OpenAlex is reachable and behaving.

name: Preview publication list

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch from OpenAlex (dry run)
        run: |
          npm run publications:dry | tee summary.txt

      - name: Put the summary in the run page
        if: always()
        run: |
          {
            echo '## Publication list preview'
            echo '```'
            cat summary.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
